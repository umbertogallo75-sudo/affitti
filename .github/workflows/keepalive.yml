name: Keep Supabase alive

# Ping leggero al database 2 volte a settimana per evitare la pausa
# automatica del piano gratuito (inattivita' > 7 giorni).
# La chiave usata e' la anon key, gia' pubblica nel codice dell'app;
# la RLS espone solo la tabella vuota "keepalive".

on:
  schedule:
    - cron: '17 6 * * 1,4'   # lunedi' e giovedi' alle 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          curl -sf "https://jhtuuyeujeejbhmnyiop.supabase.co/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpodHV1eWV1amVlamJobW55aW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNjk5NDAsImV4cCI6MjA5ODg0NTk0MH0.bDggkHYeisYbdeiWbx5MlRXmoJ8DNKGHkSlw-McQz0M" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpodHV1eWV1amVlamJobW55aW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNjk5NDAsImV4cCI6MjA5ODg0NTk0MH0.bDggkHYeisYbdeiWbx5MlRXmoJ8DNKGHkSlw-McQz0M" \
            -o /dev/null -w "HTTP %{http_code}\n"
